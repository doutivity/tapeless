# Deploys the static site to GitHub Pages on every push to main.
# Only the runtime files are copied into _site: design/, design-source/, tests/, scripts/ and the docs never go live.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Collect runtime files
        run: |
          mkdir _site
          cp index.html 404.html robots.txt humans.txt sitemap.xml site.webmanifest _site/
          cp -r assets data i18n about how-it-works privacy .well-known _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
