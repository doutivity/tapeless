<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>OG-шаблон Tapeless 1200×630</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
/* Static template for assets/img/og.png (scripts/brand/raster.mjs screenshots it at 1200x630).
   The mark is the generated favicon.svg, so a changed mark updates the OG image on the next `make brand`. */
html, body { margin: 0; min-height: 0; display: block; }
.og { position: relative; width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box; padding: 0 96px; display: grid; align-content: center; gap: 26px;
  background: #eef3f8; color: #1b2025; font-family: "Onest", system-ui, sans-serif; }
.og .tape { position: absolute; left: 0; right: 0; height: 40px; background: repeating-linear-gradient(-45deg, #f5c400 0 32px, #1f1f1f 32px 64px); }
.og .top { top: 0; } .og .bot { bottom: 0; }
.og .brand { display: flex; align-items: center; gap: 22px; font-size: 54px; font-weight: 700; letter-spacing: -.01em; }
.og .brand img { width: 96px; height: 96px; }
.og h1 { margin: 0; max-width: 1000px; font-size: 92px; line-height: 1.04; letter-spacing: -.02em; }
.og p { margin: 0; font-size: 36px; line-height: 1.3; color: #55616d; max-width: 980px; }
</style></head><body>
<div class="og">
  <div class="tape top"></div>
  <div class="brand"><img src="../assets/img/favicon.svg" alt="">Tapeless</div>
  <h1>Обери фах сам — без касети</h1>
  <p>Готовий промпт для ШІ, щоб визначитись із професією</p>
  <div class="tape bot"></div>
</div>
</body></html>
