<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>OG-шаблон Tapeless 1200×630</title>
<link rel="stylesheet" href="../design-source/fonts.css">
<style>
/* Попередній шаблон: знак — місце під вибраний варіант (Точка 0). Скрипт знімає знімок 1200×630. */
html,body{margin:0}
.og{width:1200px;height:630px;position:relative;overflow:hidden;background:#eef3f8;color:#1b2025;font-family:"Onest",system-ui,sans-serif;display:grid;align-content:center;gap:22px;padding:0 88px;box-sizing:border-box}
.og .tape{position:absolute;left:0;right:0;height:34px;background:repeating-linear-gradient(-45deg,#f5c400 0 28px,#1f1f1f 28px 56px)}
.og .top{top:0}.og .bot{bottom:0}
.og .brand{display:flex;align-items:center;gap:18px;font-size:44px;font-weight:700}
.og svg{width:76px;height:76px}
.og h1{margin:0;font-size:88px;line-height:1.05;letter-spacing:-.02em;max-width:980px}
.og p{margin:0;font-size:34px;color:#5d6874}
</style></head><body>
<div class="og"><div class="tape top"></div>
<div class="brand"><svg viewBox="0 0 48 48"><rect x="2" y="8" width="44" height="32" rx="7" fill="#0f766e"/><rect x="8" y="13" width="32" height="13" rx="4" fill="#fff"/><circle cx="18" cy="19.5" r="3.8" fill="#0f766e"/><circle cx="30" cy="19.5" r="3.8" fill="#0f766e"/><path d="M13 40l4.5-9h13l4.5 9z" fill="#fff" opacity=".9"/></svg>Tapeless</div>
<h1>Обери фах сам — без касети</h1><p>Готовий промпт для ШІ, щоб визначитись із професією</p>
<div class="tape bot"></div></div></body></html>
